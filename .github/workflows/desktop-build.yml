name: Windows .NET / WPF compile

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.cs"
      - "examples/**/*.csproj"
      - "examples/**/*.xaml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile C# examples and WPF projects
        shell: pwsh
        run: |
          $projects = @(
            "examples/01-csharp-basics/ConsoleBasics.csproj",
            "examples/03-tcp-client/TcpClientDemo.csproj",
            "examples/04-wpf-monitor/WpfMonitor.csproj",
            "examples/06-modbus-tcp-client/ModbusClientDemo.csproj",
            "examples/08-wpf-modbus-monitor/IndustrialMonitor.csproj",
            "examples/09-multi-device-monitor/MultiDeviceMonitor.csproj",
            "examples/10-operations-monitor/OperationsMonitor.csproj",
            "examples/10-operations-monitor/Smoke/SqliteSmoke.csproj"
          )
          foreach ($project in $projects) {
            dotnet build $project --configuration Release --nologo -p:UseSharedCompilation=false -maxcpucount:2
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Exercise SQLite persistence and audit (headless)
        shell: pwsh
        run: dotnet run --project examples/10-operations-monitor/Smoke/SqliteSmoke.csproj -c Release --no-build
      - name: Publish portable Windows x64 monitor
        shell: pwsh
        run: |
          dotnet publish examples/10-operations-monitor/OperationsMonitor.csproj -c Release -r win-x64 --self-contained false -o "$env:RUNNER_TEMP/monitor-v05" --nologo -p:UseSharedCompilation=false -maxcpucount:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload portable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: operations-monitor-v05-win-x64
          path: ${{ runner.temp }}/monitor-v05/
          if-no-files-found: error
          retention-days: 14
